<html lang="zh-CN">
<head>

<meta property="og:title" content="CityU MSc CS 往年卷索引">

<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2129; --border:#30363d;
    --text:#e6edf3; --muted:#8b949e; --dim:#6e7681;
    --accent:#58a6ff; --ok:#3fb950; --warn:#d29922; --bad:#f85149;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    font-size:15px; line-height:1.6; padding:40px 20px 80px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1080px;margin:0 auto}

  header{margin-bottom:28px}
  h1{font-size:26px;font-weight:650;letter-spacing:-.02em}
  h1 span{color:var(--muted);font-weight:400;font-size:16px;display:block;margin-top:6px;letter-spacing:0}
  .lede{color:var(--muted);font-size:14px;margin-top:14px;max-width:760px}
  .lede b{color:var(--text);font-weight:600}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:26px 0 22px}
  .stat{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:14px 16px}
  .stat .n{font-size:24px;font-weight:650;letter-spacing:-.02em}
  .stat .l{font-size:12px;color:var(--muted);margin-top:2px}
  .stat.ok .n{color:var(--ok)} .stat.bad .n{color:var(--bad)} .stat.warn .n{color:var(--warn)}

  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:20px}
  input[type=search],select{
    background:var(--panel);border:1px solid var(--border);color:var(--text);
    border-radius:6px;padding:8px 12px;font-size:14px;font-family:inherit;outline:none;
  }
  input[type=search]{flex:1;min-width:200px}
  input[type=search]:focus,select:focus{border-color:var(--accent)}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{
    background:var(--panel);border:1px solid var(--border);color:var(--muted);
    border-radius:20px;padding:6px 14px;font-size:13px;cursor:pointer;
    font-family:inherit;transition:.15s;
  }
  .chip:hover{border-color:var(--dim);color:var(--text)}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#0d1117;font-weight:600}

  .grid{display:flex;flex-direction:column;gap:8px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:8px;overflow:hidden;transition:.15s}
  .card:hover{border-color:#3d444d}
  .card.none{opacity:.62}

  .head{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer;user-select:none}
  .code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;font-weight:600;color:var(--accent);min-width:66px}
  .card.none .code{color:var(--dim)}
  .names{flex:1;min-width:0}
  .cn{font-size:14.5px;font-weight:500}
  .en{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .badges{display:flex;gap:6px;align-items:center;flex-shrink:0}
  .badge{font-size:11.5px;padding:2px 9px;border-radius:4px;border:1px solid;white-space:nowrap;font-variant-numeric:tabular-nums}
  .b-count{color:var(--text);border-color:var(--border);background:var(--panel2)}
  .b-ok{color:var(--ok);border-color:#238636;background:#12261a}
  .b-warn{color:var(--warn);border-color:#9e6a03;background:#2b2111}
  .b-bad{color:var(--bad);border-color:#da3633;background:#2d1416}
  .b-ans{color:var(--accent);border-color:#1f6feb;background:#0c1e35}
  .chev{color:var(--dim);font-size:11px;transition:transform .2s;margin-left:2px}
  .card.open .chev{transform:rotate(90deg)}

  .body{display:none;border-top:1px solid var(--border);padding:4px 16px 14px}
  .card.open .body{display:block}
  .note{font-size:12.5px;color:var(--warn);padding:10px 0 8px;border-bottom:1px dashed var(--border);margin-bottom:6px}
  .card.none .note{color:var(--muted);border:none;margin:0;padding:12px 0 6px}

  .files{display:flex;flex-direction:column}
  .f{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #1f242c;text-decoration:none;color:inherit}
  .f:last-child{border-bottom:none}
  .f:hover .fname{color:var(--accent);text-decoration:underline}
  .yr{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:52px}
  .fname{flex:1;font-size:13.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mini{font-size:11px;padding:1px 7px;border-radius:3px;border:1px solid var(--border);color:var(--muted);white-space:nowrap}
  .mini.ans{color:var(--ok);border-color:#238636}
  .mini.pr{color:var(--warn);border-color:#9e6a03}
  .arrow{color:var(--dim);font-size:12px}

  .empty{color:var(--muted);text-align:center;padding:40px;font-size:14px}

  footer{margin-top:44px;padding-top:20px;border-top:1px solid var(--border);font-size:12.5px;color:var(--dim);line-height:1.9}
  footer a{color:var(--muted);text-decoration:none}
  footer a:hover{color:var(--accent)}
  kbd{background:var(--panel2);border:1px solid var(--border);border-radius:3px;padding:1px 5px;font-size:11px;font-family:inherit}

  @media(max-width:680px){
    .stats{grid-template-columns:repeat(2,1fr)}
    .badges .b-ans{display:none}
    .en{display:none}
    .head{gap:10px;padding:12px}
  }
</style>
</head>

  <div class="stat warn"><div class="n" id="s-ans">13</div><div class="l">份带答案</div></div>

<div class="toolbar">

<footer>

</footer>

</div>

// ============ 渲染 ============
const gh = (r,b,p) => `https://github.com/${r}/blob/${b}/` + p.split('/').map(encodeURIComponent).join('/');
const totalFiles = DATA.reduce((s,c)=>s+c.files.length,0);
const totalAns = DATA.reduce((s,c)=>s+c.files.filter(f=>f.ans).length,0);
const totalNone = DATA.filter(c=>c.level==='none').length;
const latestOf = c => Math.max(0,...c.files.map(f=>f.y));

document.getElementById('s-total').textContent = DATA.length;
document.getElementById('s-files').textContent = totalFiles;
document.getElementById('s-ans').textContent = totalAns;
document.getElementById('s-none').textContent = totalNone;

const levelBadge = {
  full:  c => `<span class="badge b-ok">完整</span>`,
  partial: c => `<span class="badge b-warn">残缺</span>`,
  practice: c => `<span class="badge b-warn">仅练习</span>`,
  none:  c => `<span class="badge b-bad">缺口</span>`
};

let filter='all', sort='count', q='';

function visible(c){
  if(q){
    const s=(c.code+' '+c.cn+' '+c.en).toLowerCase();
    if(!s.includes(q.toLowerCase())) return false;
  }
  if(filter==='has') return c.files.length>0;
  if(filter==='ans') return c.files.some(f=>f.ans);
  if(filter==='none') return c.level==='none';
  return true;
}

function render(){
  const list = DATA.filter(visible).slice();
  if(sort==='count') list.sort((a,b)=>b.files.length-a.files.length || a.code.localeCompare(b.code));
  else if(sort==='code') list.sort((a,b)=>a.code.localeCompare(b.code));
  else list.sort((a,b)=>latestOf(b)-latestOf(a));

  const grid=document.getElementById('grid');
  if(!list.length){ grid.innerHTML='<div class="empty">没有匹配的课程</div>'; return; }

  grid.innerHTML = list.map(c=>{
    const latest = latestOf(c);
    const ansN = c.files.filter(f=>f.ans).length;
    const badges = [
      `<span class="badge b-count">${c.files.length} 份</span>`,
      latest ? `<span class="badge b-count">最近 ${latest}</span>` : '',
      ansN ? `<span class="badge b-ans">${ansN} 份带答案</span>` : '',
      levelBadge[c.level](c)
    ].join('');

    const files = c.files.map(f=>`
      <a class="f" href="${gh(f.r,f.b,f.p)}" target="_blank" rel="noopener">
        <span class="yr">${f.y? f.y : '—'}</span>
        <span class="mini">${f.ty}</span>
        ${f.ans?'<span class="mini ans">答案</span>':''}
        ${f.partial?'<span class="mini pr">不完整</span>':''}
        <span class="fname">${f.p.split('/').pop()}</span>
        <span class="arrow">↗</span>
      </a>`).join('');

    return `<div class="card ${c.level==='none'?'none':''}">
      <div class="head">
        <span class="code">${c.code}</span>
        <span class="names"><div class="cn">${c.cn}</div><div class="en">${c.en}</div></span>
        <span class="badges">${badges}<span class="chev">▶</span></span>
      </div>
      <div class="body">
        <div class="note">${c.note}</div>
        ${c.files.length? `<div class="files">${files}</div>` : ''}
      </div>
    </div>`;
  }).join('');

  grid.querySelectorAll('.head').forEach(h=>{
    h.onclick=()=>h.parentElement.classList.toggle('open');
  });
}

document.getElementById('q').oninput = e=>{ q=e.target.value; render(); };
document.getElementById('sort').onchange = e=>{ sort=e.target.value; render(); };
document.querySelectorAll('.chip').forEach(ch=>{
  ch.onclick=()=>{
    document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));
    ch.classList.add('on'); filter=ch.dataset.f; render();
  };
});

render();
// 默认展开存量最多的一门
const firstCard = document.querySelector('.card');
if (firstCard) firstCard.classList.add('open');
</script>
</body>
</html>
